<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">OPSA training overview</title>
  <desc id="desc">The current actor recomputes token log probabilities and entropies, selects the lowest-log-probability tokens locally on each data-parallel worker, maps entropy to negative advantage, and masks all other tokens out of policy loss.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .label { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .body { font: 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .formula { font: 600 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #4338ca; }
      .box { stroke-width: 2; rx: 18; }
      .arrow { stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="360" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">On-Policy Self-Adaptation (OPSA)</text>

  <rect x="35" y="92" width="240" height="205" class="box" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="155" y="128" text-anchor="middle" class="label">Current actor</text>
  <text x="155" y="164" text-anchor="middle" class="body">Sample response tokens</text>
  <text x="155" y="194" text-anchor="middle" class="body">Recompute actor logp</text>
  <text x="155" y="224" text-anchor="middle" class="body">Compute actor entropy</text>
  <text x="155" y="262" text-anchor="middle" class="formula">(log pᵢ, Hᵢ)</text>

  <line x1="285" y1="194" x2="328" y2="194" class="arrow"/>

  <rect x="340" y="92" width="240" height="205" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="460" y="128" text-anchor="middle" class="label">DP-local selection</text>
  <text x="460" y="164" text-anchor="middle" class="body">Concatenate valid tokens</text>
  <text x="460" y="194" text-anchor="middle" class="body">Select lowest actor logp</text>
  <text x="460" y="232" text-anchor="middle" class="formula">K = max(1, ⌊fN⌋)</text>
  <text x="460" y="264" text-anchor="middle" class="body">Canonical f = 0.2</text>

  <line x1="590" y1="194" x2="633" y2="194" class="arrow"/>

  <rect x="645" y="92" width="240" height="205" class="box" fill="#fff7ed" stroke="#fb923c"/>
  <text x="765" y="128" text-anchor="middle" class="label">Entropy mapping</text>
  <text x="765" y="164" text-anchor="middle" class="body">Normalize within selection</text>
  <text x="765" y="202" text-anchor="middle" class="formula">A = Aₘₐₓ +</text>
  <text x="765" y="228" text-anchor="middle" class="formula">(Aₘᵢₙ − Aₘₐₓ)r</text>
  <text x="765" y="264" text-anchor="middle" class="body">Higher H → more negative A</text>

  <line x1="895" y1="194" x2="938" y2="194" class="arrow"/>

  <rect x="950" y="92" width="215" height="205" class="box" fill="#ecfdf5" stroke="#34d399"/>
  <text x="1058" y="128" text-anchor="middle" class="label">Selective update</text>
  <text x="1058" y="164" text-anchor="middle" class="body">Selected tokens only</text>
  <text x="1058" y="194" text-anchor="middle" class="body">Negative advantage</text>
  <text x="1058" y="224" text-anchor="middle" class="body">Unselected tokens masked</text>
  <text x="1058" y="262" text-anchor="middle" class="formula">opsa_loss_mask</text>

  <text x="600" y="330" text-anchor="middle" class="body">Zero task reward · No teacher forward · No reference KL</text>
</svg>
