default_language_version:
  python: python3

ci:
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit suggestions'
  autoupdate_schedule: quarterly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1000']
        # Retained upstream documentation asset. Keep the size guard for every
        # newly added project artifact.
        exclude: ^slime/docs/_static/image/trace\.png$
      - id: requirements-txt-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff-check
        args: [--fix, --no-cache, --config=slime/pyproject.toml]
        files: ^slime/

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.0.2
    hooks:
      - id: autoflake
        args: [--remove-all-unused-imports, --in-place]
        files: ^slime/

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2          # 选一个稳定版本
    hooks:
      - id: isort
        args:
          - "--settings-path=slime/pyproject.toml"
          - "--filter-files"
        additional_dependencies: []
        files: ^slime/

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        name: Format code
        args: [--config=slime/pyproject.toml]
        additional_dependencies: ['click==8.0.2']
        files: ^slime/
